schema: spec-driven
context: |
  VibeMarket — учебный frontend интернет-магазина.
  Спецификации описывают поведение текущей версии приложения: каталог товаров,
  формы входа и регистрации и переходы между экранами. Интеграция с backend
  пока не входит в описанное поведение.
rules:
  specs:
    - Описывать наблюдаемое поведение приложения и проверяемые сценарии.
    - Отделять реализованные возможности от запланированных.
