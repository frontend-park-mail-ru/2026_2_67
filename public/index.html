<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OZON — учебный проект</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Handlebars  шаблонизатор. -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>

    <!-- Шаблон главной страницы с каталогом. -->
    <script id="catalog-template" type="text/x-handlebars-template">
      <main class="page catalog-page">
        <header class="site-header">
          <a class="site-header__logo" href="#" data-page="catalog" aria-label="OZON — каталог">OZON</a>
          <form class="search-placeholder" data-search-form>
            <input type="search" placeholder="Искать товары" aria-label="Поиск товаров" />
            <button type="submit" aria-label="Искать">⌕</button>
          </form>
          <nav class="site-header__nav" aria-label="Основная навигация">
            <a class="site-header__action" href="#" data-page="login">Войти</a>
            <a class="site-header__action" href="#" data-page="signup">Регистрация</a>
          </nav>
        </header>
        <section class="catalog-page__content">
          <h1>Каталог товаров</h1>
          <div class="catalog-page__grid">{{{productsHtml}}}</div>
        </section>
      </main>
    </script>

    <!-- Один шаблон используется для всех карточек товаров. -->
    <script id="product-card-template" type="text/x-handlebars-template">
      <article class="product-card" data-product-card data-product-id="{{id}}">
        <div class="product-card__image-wrap">
          <img class="product-card__image" data-product-image src="{{currentImage}}" alt="{{title}}" />
          {{#if hasMultipleImages}}
            <button class="product-card__arrow product-card__arrow--prev" type="button" data-image-prev aria-label="Предыдущая фотография">←</button>
            <button class="product-card__arrow product-card__arrow--next" type="button" data-image-next aria-label="Следующая фотография">→</button>
            <div class="product-card__dots" aria-label="Фотографии товара">
              {{#each dots}}
                <button class="product-card__dot {{#if isActive}}product-card__dot--active{{/if}}" type="button" data-image-dot="{{index}}" aria-label="Показать фотографию {{index}}"></button>
              {{/each}}
            </div>
          {{/if}}
        </div>
        <h2 class="product-card__title">{{title}}</h2>
        <p class="product-card__price">{{price}}</p>
        <p class="product-card__rating">★ {{rating}} <span>({{reviewsCount}} отзывов)</span></p>
      </article>
    </script>

    <!-- Шаблон страницы входа. -->
    <script id="login-template" type="text/x-handlebars-template">
      <main class="page auth-page">
        <a class="auth-page__back button-link" href="#" data-page="catalog">← В каталог</a>
        <section class="auth-card">
          <h1>Авторизация</h1>
          <form data-auth-form="login" novalidate>
            <label>Email<input type="email" name="email" /></label>
            <p class="field-error" data-error-for="email"></p>
            <label>Пароль<input type="password" name="password" /></label>
            <p class="field-error" data-error-for="password"></p>
            <button type="submit">Войти</button>
          </form>
          <p class="form-message" data-form-message></p>
          <p class="auth-card__switch">Нет аккаунта? <a class="button-link button-link--small" href="#" data-page="signup">Зарегистрироваться</a></p>
        </section>
      </main>
    </script>

    <!-- Шаблон страницы регистрации. -->
    <script id="signup-template" type="text/x-handlebars-template">
      <main class="page auth-page">
        <a class="auth-page__back button-link" href="#" data-page="catalog">← В каталог</a>
        <section class="auth-card">
          <h1>Регистрация</h1>
          <form data-auth-form="signup" novalidate>
            <label>Имя<input type="text" name="name" /></label>
            <p class="field-error" data-error-for="name"></p>
            <label>Email<input type="email" name="email" /></label>
            <p class="field-error" data-error-for="email"></p>
            <label>Пароль<input type="password" name="password" /></label>
            <p class="field-error" data-error-for="password"></p>
            <label>Повторите пароль<input type="password" name="passwordRepeat" /></label>
            <p class="field-error" data-error-for="passwordRepeat"></p>
            <button type="submit">Зарегистрироваться</button>
          </form>
          <p class="form-message" data-form-message></p>
          <p class="auth-card__switch">Уже есть аккаунт? <a class="button-link button-link--small" href="#" data-page="login">Войти</a></p>
        </section>
      </main>
    </script>

    <!-- JS  подключаются в порядке зависимостей. -->
    <script src="/js/products.js"></script>
    <script src="/js/templates.js"></script>
    <script src="/js/product-card.js"></script>
    <script src="/js/validation.js"></script>
    <script src="/js/pages.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
