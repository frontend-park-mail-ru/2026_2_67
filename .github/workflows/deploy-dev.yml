name: Deploy to Dev Server

on:
  push:
    branches: [ dev ] 
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          debug: true
          script: |
            PROJECT_DIR=${{ secrets.PROJECT_PATH }}
            export PORT=80
            LOG_FILE="frontend.log"
            BRANCH="dev"

            echo "==> Переходим в директорию ${PROJECT_DIR}..."
            sudo cd "${PROJECT_DIR}"

            echo "==> Обновление ветки ${BRANCH}"
            sudo git checkout ${BRANCH}
            sudo git pull
            echo "==> Ветка ${BRANCH} актуализирована"

            echo "==> Проверка свободности порта ${PORT}..."
            if ss -tlnp | grep ":${PORT}\s"; then
              echo "==> Освобождение порта ${PORT}"
              sudo kill $(ss -tlnp | grep ":${PORT}\s" | grep -oP  'pid=\K[0-9]+') || true
            fi
            echo "==> Порт ${PORT} свободен"

            echo "==> Запуск frontend..."
            sudo nohup npm start > "${LOG_FILE}" 2>&1 &

            echo "==> Деплой успешно завершен!"
